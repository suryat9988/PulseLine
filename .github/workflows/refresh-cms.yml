name: Refresh CMS financial data

on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Test refresh safeguards
        run: python -m unittest discover -s scripts -p 'test_refresh_cms.py'
      - name: Fetch and validate reviewed CMS cohort
        run: python scripts/refresh_cms.py
      - name: Validate application with refreshed data
        run: |
          npm test
          npm run typecheck
          npm run lint
          npm run build
        env:
          PAGES_BASE: /PulseLine/
      - name: Commit only validated CMS data
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cms/dashboard-research.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh reviewed CMS financial data'
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Report successful check
        run: echo 'CMS financial data checked, validated and built. Historical publication dates remain unverified.' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # GITHUB_TOKEN commits do not trigger the normal push workflow.
      # Deploy this validated build explicitly so the live site also refreshes.
      - id: deployment
        uses: actions/deploy-pages@v4
